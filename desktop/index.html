<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>다운로드 정리</title>
<link rel="stylesheet" href="assets/icons.css"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="rail">
  <button class="location" data-action="openDownloads" title="탐색기에서 다운로드 폴더 열기"><span class="location-icon"><i class="ph ph-download-simple"></i></span><strong>내 다운로드</strong><i class="ph ph-arrow-up-right"></i></button>
  <nav aria-label="주 메뉴">
    <button class="nav-item active" data-view="review"><i class="ph ph-squares-four"></i>파일 검토</button>
    <button class="nav-item" data-view="matrix"><i class="ph ph-grid-nine"></i>유사도 행렬</button>
    <button class="nav-item" data-view="flow"><i class="ph ph-git-branch"></i>분석 과정</button>
  </nav>
  <div class="rail-section"><span>추천 그룹</span><b id="rail-count">0</b></div>
  <div id="group-nav"></div>
  <div class="rail-bottom">
    <button data-action="undo"><i class="ph ph-arrow-counter-clockwise"></i>최근 이동 되돌리기</button>
    <button data-action="settings"><i class="ph ph-sliders-horizontal"></i>분석 설정</button>
  </div>
</aside>
<div class="workspace">
  <div class="topline"><i class="ph ph-folder-notch"></i><button data-action="all">다운로드</button><i class="ph ph-caret-right"></i><span id="crumb">파일 검토</span></div>
  <main>
    <header class="heading"><div><h1 id="headline">다운로드 정리</h1><button id="root-path" data-action="openDownloads" title="탐색기에서 열기"><i class="ph ph-folder-open"></i><span>다운로드 폴더 확인 중</span><i class="ph ph-arrow-up-right"></i></button></div>
      <div class="actions"><button class="btn" data-action="scan"><i class="ph ph-arrows-clockwise"></i>다시 분석</button><button class="btn primary" id="organize" data-action="organize"><i class="ph ph-folder-simple-plus"></i>폴더로 정리</button></div>
    </header>
    <div id="status" hidden role="status"></div>
    <div id="content"></div>
  </main>
</div>
<dialog id="dialog"><div class="dialog-frame" id="dialog-frame"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="renderer.js"></script></body></html>
