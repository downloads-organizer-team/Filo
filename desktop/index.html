<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>파일 정리</title>
<link rel="stylesheet" href="assets/icons.css"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="rail">
  <button class="location" data-view="search" title="파일 검색"><span class="location-icon"><i aria-hidden="true" class="ph ph-folder-notch"></i></span><strong>내 파일 정리</strong></button>
  <nav aria-label="주 메뉴">
    <button class="nav-item active" data-view="search"><i aria-hidden="true" class="ph ph-magnifying-glass"></i>파일 검색</button>
    <button class="nav-item" data-view="review"><i aria-hidden="true" class="ph ph-squares-four"></i>파일 정리</button>
  </nav>
  <div class="rail-section"><span>파일 묶음</span><b id="rail-count">0</b></div>
  <label class="group-search"><i aria-hidden="true" class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="group-search" type="search" aria-label="묶음 이름 필터" placeholder="묶음 찾기"></label>
  <div id="group-nav"></div>
  <div class="rail-bottom">
    <button data-action="history"><i aria-hidden="true" class="ph ph-clock-counter-clockwise"></i>최근 정리</button>
    <button data-action="undo"><i aria-hidden="true" class="ph ph-arrow-counter-clockwise"></i>이동 되돌리기</button>
    <details class="advanced"><summary>분석 도구</summary><button data-view="matrix"><i aria-hidden="true" class="ph ph-grid-nine"></i>유사도 행렬</button><button data-view="flow"><i aria-hidden="true" class="ph ph-git-branch"></i>분석 과정</button></details>
    <button data-action="settings"><i aria-hidden="true" class="ph ph-sliders-horizontal"></i>분석 설정</button>
  </div>
</aside>
<div class="workspace">
  <div class="topline"><i aria-hidden="true" class="ph ph-folder-notch"></i><button data-view="search">내 파일</button><i aria-hidden="true" class="ph ph-caret-right"></i><span id="crumb">파일 검색</span></div>
  <main>
    <header class="heading"><div><h1 id="headline">파일 검색</h1></div>
      <div class="actions"><button class="btn" data-action="scan" hidden><i aria-hidden="true" class="ph ph-arrows-clockwise"></i>다시 분석</button><button class="btn primary" data-action="sources"><i aria-hidden="true" class="ph ph-folder-open"></i><span id="setup-label">파일 정리하기</span></button></div>
    </header>
    <details id="root-path" hidden><summary></summary><ul></ul></details>
    <div id="status" hidden>
      <span id="status-label" role="status"></span>
      <div class="scan-meter" hidden>
        <progress id="scan-progress" max="100" aria-labelledby="status-label"></progress>
        <span id="scan-value" aria-hidden="true"></span>
      </div>
      <span id="scan-elapsed" hidden></span>
      <button data-action="cancel" hidden>분석 취소</button>
    </div>
    <section id="search-home" aria-label="내 PC 파일 검색">
      <label class="live-query"><i aria-hidden="true" class="ph ph-magnifying-glass"></i><input id="external-query" type="search" maxlength="200" autofocus autocomplete="off" placeholder="파일이나 폴더 이름 검색" aria-label="파일이나 폴더 이름 검색"><kbd>Ctrl K</kbd></label>
      <div class="search-list"><div id="search-meta" role="status">파일·폴더 이름 검색</div><div class="table-scroll"><table><thead><tr><th scope="col">이름</th><th scope="col">경로</th></tr></thead><tbody id="search-rows"></tbody></table><p id="search-empty" class="empty" role="status">이름을 입력하면 파일과 폴더가 여기에 표시됩니다.</p></div></div>
    </section>
    <div id="content" hidden></div>
    <footer class="review-bar" hidden><div><strong id="review-count" aria-live="polite"></strong><span id="review-hint"></span></div><button class="btn" id="organize" data-action="organize" disabled><i aria-hidden="true" class="ph ph-folder-simple-plus"></i>이동 경로 미리보기</button><button class="btn primary" id="move-selected" data-action="moveSelected" disabled><i aria-hidden="true" class="ph ph-arrow-right"></i>파일 이동</button></footer>
  </main>
</div>
<dialog id="dialog"><div class="dialog-frame" id="dialog-frame"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="renderer.js"></script></body></html>
