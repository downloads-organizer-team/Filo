<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>파일 정리</title>
<link rel="stylesheet" href="assets/icons.css"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="rail">
  <button class="location" data-action="all" title="전체 파일 검토"><span class="location-icon"><i class="ph ph-folder-notch"></i></span><strong>내 파일 정리</strong><i class="ph ph-arrow-up-right"></i></button>
  <nav aria-label="주 메뉴">
    <button class="nav-item active" data-view="review"><i class="ph ph-squares-four"></i>파일 검토</button>
    <button class="nav-item" data-action="externalSearch"><i class="ph ph-magnifying-glass"></i>다른 위치에서 찾기</button>
  </nav>
  <div class="rail-section"><span>파일 묶음</span><b id="rail-count">0</b></div>
  <label class="group-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="group-search" type="search" aria-label="묶음 이름 필터" placeholder="묶음 찾기"></label>
  <div id="group-nav"></div>
  <div class="rail-bottom">
    <button data-action="history"><i class="ph ph-clock-counter-clockwise"></i>최근 정리</button>
    <button data-action="undo"><i class="ph ph-arrow-counter-clockwise"></i>이동 되돌리기</button>
    <details class="advanced"><summary>분석 도구</summary><button data-view="matrix"><i class="ph ph-grid-nine"></i>유사도 행렬</button><button data-view="flow"><i class="ph ph-git-branch"></i>분석 과정</button></details>
    <button data-action="settings"><i class="ph ph-sliders-horizontal"></i>분석 설정</button>
  </div>
</aside>
<div class="workspace">
  <div class="topline"><i class="ph ph-folder-notch"></i><button data-action="all">내 파일</button><i class="ph ph-caret-right"></i><span id="crumb">파일 검토</span></div>
  <main>
    <header class="heading"><div><h1 id="headline">파일 검토</h1><p class="workspace-intro">일상 · 업무 · 개인 프로젝트, 관련된 파일을 검토하고 원하는 위치로 정리하세요.</p></div>
      <div class="actions"><button class="btn" id="root-path" data-action="sources"><i class="ph ph-folder-open"></i><span>분석 폴더 0개</span></button><button class="btn" data-action="scan"><i class="ph ph-arrows-clockwise"></i>다시 분석</button></div>
    </header>
    <div id="status" hidden role="status"></div>
    <div id="content"><div class="panel empty">파일을 분석하고 있습니다. 분석 폴더는 위 버튼에서 관리하세요.</div></div>
    <footer class="review-bar"><div><strong id="review-count">추천 파일 확인 중</strong><span id="review-hint">파일 이동 전 정확한 경로를 미리 봅니다.</span></div><button class="btn primary" id="organize" data-action="organize" disabled><i class="ph ph-folder-simple-plus"></i>위치 선택 · 미리보기</button></footer>
  </main>
</div>
<dialog id="dialog"><div class="dialog-frame" id="dialog-frame"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="renderer.js"></script></body></html>
